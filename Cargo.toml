[package]
name = "dittomo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Retarget animation from any skeleton onto any other: the more alike the two, the closer the copy"
readme = "README.md"
license = "MIT-0"
repository = "https://github.com/Azazel-Labs/dittomo"
include = ["/src/**", "/README.md", "/LICENSE"]
keywords = ["animation", "retargeting", "skeleton", "gltf", "gamedev"]
categories = ["graphics", "game-development"]

[features]
# Skeletons and clips read from glTF, GLB, FBX and BVH in memory, through polysmelt (builds for wasm).
load = ["dep:polysmelt", "dep:serde_json"]
# `load`, plus reading model files from disk.
fs = ["load", "polysmelt/fs"]
# `load`, plus USD (polysmelt's `usd` feature needs Rust 1.96).
usd = ["load", "polysmelt/usd"]

[dependencies]
glam = "0.34"
# To try a polysmelt fix before it's released, add `[patch.crates-io] polysmelt = { path = "../polysmelt" }`
# with that checkout's version set to this one.
polysmelt = { version = "0.18.2", default-features = false, features = ["gltf", "fbx", "bvh"], optional = true }
# The glTF JSON of polysmelt's documents, for clips written back.
serde_json = { version = "1", optional = true }

[dev-dependencies]
# Textures for the video example.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
needless_range_loop = "allow"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"

# `cargo install dittomo --features fs` installs it.
[[bin]]
name = "dittomo"
path = "src/main.rs"
required-features = ["fs"]

[[bench]]
name = "retarget"
harness = false

[[bench]]
name = "san"
harness = false

[[bench]]
name = "rigs"
harness = false
required-features = ["fs"]

[[bench]]
name = "animals"
harness = false
required-features = ["fs"]

[[example]]
name = "video"
required-features = ["fs"]
