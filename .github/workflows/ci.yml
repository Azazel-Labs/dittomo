name: CI

# Formatting, clippy with and without model loading, the tests, the baked-clip shader run against
# the CPU reader on a software Vulkan adapter, the browser demo (deployed to Pages from main),
# mapping accuracy on real rigs, and on pull requests a benchmark of the base and the change on the
# same runner that fails if the change got slower. On main, once those pass, a version in Cargo.toml that hasn't been
# released yet is published to crates.io and tagged with a GitHub release (the release job).
#
# dittomo reads models through polysmelt from crates.io. The bench job still checks polysmelt out
# beside the base, as bases from before then read it as a path dependency.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install && rustup component add rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", --features load, --features fs]
    steps:
      - uses: actions/checkout@v5
        with:
          path: dittomo
      - run: rustup toolchain install && rustup component add clippy
        working-directory: dittomo
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dittomo
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
        working-directory: dittomo

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: dittomo
      - run: rustup toolchain install
        working-directory: dittomo
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dittomo
      - run: cargo test --all-targets --features fs
        working-directory: dittomo
      - run: cargo test --doc --features fs
        working-directory: dittomo

  # `bake`'s WGSL run in compute shaders and held to the CPU reader, number for number. The runner has
  # no GPU, so Mesa's lavapipe stands in: Vulkan on the CPU, which runs compute shaders. The check
  # fails if it finds no adapter (GPU_CHECK_OPTIONAL is left unset).
  gpu-check:
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
        with:
          path: dittomo
      - run: rustup toolchain install && rustup component add rustfmt clippy
        working-directory: dittomo
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-tools
      # Which adapters the loader finds, for when the check says there are none.
      - run: vulkaninfo --summary || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dittomo/gpu-check
      - run: cargo fmt --check
        working-directory: dittomo/gpu-check
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: dittomo/gpu-check
      - name: The shader against the CPU reader
        shell: bash
        working-directory: dittomo/gpu-check
        run: |
          status=0
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo run --release | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The browser demo: built for wasm, then driven from node as the page drives it.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: dittomo
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown && rustup component add clippy
        working-directory: dittomo
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dittomo/demo
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
        working-directory: dittomo/demo
      - run: sh build.sh && node check.mjs
        working-directory: dittomo/demo
      # The page as built and checked, published on GitHub Pages from main.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dittomo/demo/www

  # The browser demo at https://azazel-labs.github.io/dittomo/, one deployment at a time.
  pages:
    needs: demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Mapping on real rigs: downloads them (cached on the script, which pins each by commit and
  # SHA-256), writes the accuracy table to the job summary, and fails below the floor.
  rigs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: dittomo
      - run: rustup toolchain install
        working-directory: dittomo
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dittomo
      - uses: actions/cache@v5
        with:
          path: dittomo/bench/rigs/data
          key: rigs-${{ hashFiles('dittomo/bench/rigs/fetch.sh') }}
      - run: sh bench/rigs/fetch.sh
        working-directory: dittomo
      - run: cargo bench --features fs --bench rigs -- --min 99 --max-degrees 3 | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
        working-directory: dittomo
      # Four-legged animals of different builds, from a fox to an alpaca: joints found, posture at rest, feet in
      # the floor.
      - uses: actions/cache@v5
        with:
          path: dittomo/bench/animals/data
          key: animals-${{ hashFiles('dittomo/bench/animals/fetch.sh') }}
      - run: sh bench/animals/fetch.sh
        working-directory: dittomo
      - run: cargo bench --features fs --bench animals -- --min 100 --max-posture 1 --max-floor 0.5 --max-body 0.5 | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
        working-directory: dittomo

  # Both builds run on one runner, one after the other, so the machine is the same for each.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: dittomo
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base/dittomo
      - uses: actions/checkout@v5
        with:
          repository: Azazel-Labs/polysmelt
          path: polysmelt
      - run: ln -s "$PWD/polysmelt" base/polysmelt
      - run: rustup toolchain install
        working-directory: dittomo
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dittomo
            base/dittomo
      - name: Base
        working-directory: base/dittomo
        run: |
          if [ -f benches/retarget.rs ]; then
            cargo bench --bench retarget -- --budget 2 --json "$GITHUB_WORKSPACE/base.json"
          fi
      - name: Change
        working-directory: dittomo
        run: |
          if [ -f "$GITHUB_WORKSPACE/base.json" ]; then
            cargo bench --bench retarget -- --budget 2 --against "$GITHUB_WORKSPACE/base.json" --slack 0.25 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cargo bench --bench retarget -- --budget 2 | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # dittomo, three.js and Babylon.js playing the same clip on the same rigs, one after the other on one runner.
  three:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: dittomo
      - run: rustup toolchain install
        working-directory: dittomo
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dittomo
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: dittomo
        working-directory: dittomo
        run: |
          cargo bench --bench retarget -- --dump target/rigs.json
          cargo bench --bench retarget | tee -a "$GITHUB_STEP_SUMMARY"
      - name: three.js
        working-directory: dittomo/bench/three
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node retarget.mjs ../../target/rigs.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Babylon.js
        working-directory: dittomo/bench/babylon
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node retarget.mjs ../../target/rigs.json | tee -a "$GITHUB_STEP_SUMMARY"

  # Releases: Cargo.toml's version is the one source of truth. On a push to main whose checks pass, a version no
  # vX.Y.Z tag has yet is published to crates.io and tagged with a GitHub release; a version already tagged releases
  # nothing, so changes collect until the next one. Raise it with scripts/bump.sh patch|minor|major|X.Y.Z. Each step
  # skips what's done, so a rerun after a partial failure picks up where it stopped. Needs the secret
  # CARGO_REGISTRY_TOKEN.
  release:
    needs: [fmt, clippy, test, gpu-check, demo, rigs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      # The version dittomo started at, which was never released: the first release is the first version after it.
      UNRELEASED: 0.1.0
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Cargo.toml's version, '$version', isn't X.Y.Z"; exit 1
          fi
          if [ "$version" = "$UNRELEASED" ]; then
            echo "$version is the version dittomo started at; raise it to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A version behind the newest release is a mistake (pre-releases of the newest X.Y.Z are fine).
          newest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          newest="${newest#v}"; newest="${newest%%-*}"
          if [ -n "$newest" ] && [ "$newest" != "${version%%-*}" ] &&
             [ "$(printf '%s\n%s\n' "$newest" "${version%%-*}" | sort -V | tail -1)" = "$newest" ]; then
            echo "::error::Cargo.toml says $version, behind the newest release, v$newest. Raise it with scripts/bump.sh."
            exit 1
          fi
          if [[ "$version" == *-* ]] && git rev-parse -q --verify "refs/tags/v${version%%-*}" >/dev/null; then
            echo "::error::Cargo.toml says $version, a pre-release of v${version%%-*}, which is already out."
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing v$version"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.release == 'true'
        run: rustup toolchain install
      - name: Publish to crates.io
        if: steps.plan.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' -A "dittomo-release (https://github.com/$GH_REPO)" \
            "https://crates.io/api/v1/crates/dittomo/$VERSION")"
          if [ "$status" = "200" ]; then
            echo "dittomo $VERSION is already on crates.io; skipping"
          elif [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Add the CARGO_REGISTRY_TOKEN repository secret, allowed to publish dittomo (and to create it, for the first release)."
            exit 1
          else
            cargo publish --locked
          fi
      - name: Tag and create GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          prerelease=""; [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          notes="On crates.io: [dittomo $VERSION](https://crates.io/crates/dittomo/$VERSION) (\`cargo add dittomo\`, or \`cargo install dittomo --features fs\` for the command)."
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "dittomo $VERSION" --notes "$notes" --generate-notes $prerelease
