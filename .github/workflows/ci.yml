name: CI

# Formatting, clippy with and without model loading, the tests, the browser demo, mapping accuracy
# on real rigs, and on pull requests a benchmark of the base and the change on the same runner that
# fails if the change got slower.
#
# mummer reads models through polysmelt, a path dependency beside it, so every job checks the two
# out side by side.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup component add rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", --features load, --features fs]
    steps:
      - uses: actions/checkout@v4
        with:
          path: mummer
      - uses: actions/checkout@v4
        with:
          repository: Azazel-Labs/polysmelt
          path: polysmelt
      - run: rustup toolchain install && rustup component add clippy
        working-directory: mummer
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mummer
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
        working-directory: mummer

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: mummer
      - uses: actions/checkout@v4
        with:
          repository: Azazel-Labs/polysmelt
          path: polysmelt
      - run: rustup toolchain install
        working-directory: mummer
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mummer
      - run: cargo test --all-targets --features fs
        working-directory: mummer
      - run: cargo test --doc --features fs
        working-directory: mummer

  # The browser demo: built for wasm, then driven from node as the page drives it.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mummer
      - uses: actions/checkout@v4
        with:
          repository: Azazel-Labs/polysmelt
          path: polysmelt
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown && rustup component add clippy
        working-directory: mummer
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mummer/demo
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
        working-directory: mummer/demo
      - run: sh build.sh && node check.mjs
        working-directory: mummer/demo

  # Mapping on real rigs: downloads them (cached on the script, which pins each by commit and
  # SHA-256), writes the accuracy table to the job summary, and fails below the floor.
  rigs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mummer
      - uses: actions/checkout@v4
        with:
          repository: Azazel-Labs/polysmelt
          path: polysmelt
      - run: rustup toolchain install
        working-directory: mummer
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mummer
      - uses: actions/cache@v4
        with:
          path: mummer/bench/rigs/data
          key: rigs-${{ hashFiles('mummer/bench/rigs/fetch.sh') }}
      - run: sh bench/rigs/fetch.sh
        working-directory: mummer
      - run: cargo bench --features fs --bench rigs -- --min 90 --max-degrees 4 | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
        working-directory: mummer

  # Both builds run on one runner, one after the other, so the machine is the same for each.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mummer
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base/mummer
      - uses: actions/checkout@v4
        with:
          repository: Azazel-Labs/polysmelt
          path: polysmelt
      - run: ln -s "$PWD/polysmelt" base/polysmelt
      - run: rustup toolchain install
        working-directory: mummer
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mummer
            base/mummer
      - name: Base
        working-directory: base/mummer
        run: |
          if [ -f benches/retarget.rs ]; then
            cargo bench --bench retarget -- --budget 2 --json "$GITHUB_WORKSPACE/base.json"
          fi
      - name: Change
        working-directory: mummer
        run: |
          if [ -f "$GITHUB_WORKSPACE/base.json" ]; then
            cargo bench --bench retarget -- --budget 2 --against "$GITHUB_WORKSPACE/base.json" --slack 0.25 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cargo bench --bench retarget -- --budget 2 | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # mummer, three.js and Babylon.js playing the same clip on the same rigs, one after the other on one runner.
  three:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mummer
      - uses: actions/checkout@v4
        with:
          repository: Azazel-Labs/polysmelt
          path: polysmelt
      - run: rustup toolchain install
        working-directory: mummer
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mummer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: mummer
        working-directory: mummer
        run: |
          cargo bench --bench retarget -- --dump target/rigs.json
          cargo bench --bench retarget | tee -a "$GITHUB_STEP_SUMMARY"
      - name: three.js
        working-directory: mummer/bench/three
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node retarget.mjs ../../target/rigs.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Babylon.js
        working-directory: mummer/bench/babylon
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node retarget.mjs ../../target/rigs.json | tee -a "$GITHUB_STEP_SUMMARY"
