[package]
name = "dittomo-demo"
version = "0.0.0"
edition = "2024"
publish = false
description = "dittomo in the browser: drop in two models, see the mapping, play the clip"
license = "MIT-0"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
dittomo = { path = "..", features = ["load"] }
# Its documents, pruned of the target's own clips before one is written.
polysmelt = { version = "0.18.2", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Its own workspace, so it builds apart from dittomo.
[workspace]
