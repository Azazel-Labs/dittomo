[package]
name = "mummer-demo"
version = "0.0.0"
edition = "2024"
publish = false
description = "mummer in the browser: drop in two models, see the mapping, play the clip"
license = "MIT-0"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
mummer = { path = "..", features = ["load"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Its own workspace, so it builds apart from mummer.
[workspace]
